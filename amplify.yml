version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run sync:projects
        - npm run build
    postBuild:
      commands:
        - pip3 install boto3 -q
        - python3 scripts/push-rag-artifacts.py
  artifacts:
    baseDirectory: out
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
